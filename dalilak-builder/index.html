<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dalilak Service Builder</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f6f8fb;color:#24364b}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe6ef;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}header b{color:#246aa4;font-size:20px}.wrap{max-width:960px;margin:auto;padding:14px 12px 70px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 10px}.hint{font-size:12px;color:#75859a;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700}input,select{width:100%;border:1px solid #ccd7e4;border-radius:9px;padding:10px;font:inherit;background:white}button{border:0;border-radius:9px;padding:9px 12px;background:#2b79b6;color:white;font:inherit;font-weight:750}button.s{background:#eef4f9;color:#365f82;border:1px solid #d4dfeb}button.d{background:#fff1f1;color:#c54040;border:1px solid #efb8b8}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;background:white;color:#425c75;border:1px solid #d7e1ec}.tab.on{background:#2b79b6;color:white}.pane{display:none}.pane.on{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:9px}.list .row{border:1px solid #dfe7ef;border-radius:11px;padding:10px;margin-top:9px;background:#fbfcfe}.rgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:7px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9f3fa;color:#376a92;font-size:11px}.preview{max-width:520px;margin:auto;border:1px solid #dce5ee;border-radius:16px;overflow:hidden;background:white}.ptop{padding:12px 14px;border-bottom:1px solid #e6ebf1;color:#246aa4;font-weight:800}.screen{padding:14px}.f{margin:12px 0}.upload{border:1px dashed #becbd8;border-radius:9px;padding:11px;text-align:center;color:#657f96;margin-top:6px}.fee{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf1f5}.total{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding-top:10px}.json{direction:ltr;text-align:left;white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;overflow:auto;font-size:11px}.empty{text-align:center;color:#8290a1;padding:18px;border:1px dashed #ccd7e3;border-radius:10px}.bar{position:sticky;bottom:8px;background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:8px;box-shadow:0 5px 16px #0001}@media(max-width:700px){.grid,.rgrid{grid-template-columns:1fr}.head,.bar{align-items:stretch;flex-direction:column}}</style></head><body><header><b>Dalilak</b><button class="s" onclick="example()">مثال جاهز</button></header><div class="wrap"><div class="card"><h2>معلومات الخدمة</h2><div class="grid"><label>اسم الخدمة بالعربي<input id="sn" placeholder="إصدار إقامة عامل مساعد"></label><label>Service Name<input id="se" dir="ltr"></label><label>القسم<input id="cat" placeholder="الإقامة والتأشيرات"></label><label>Service Code<input id="code" dir="ltr"></label></div></div><div class="tabs"><button class="tab on" data-p="fields">1 الخانات</button><button class="tab" data-p="docs">2 المستندات</button><button class="tab" data-p="fees">3 الرسوم</button><button class="tab" data-p="prev">4 تجربة التطبيق</button><button class="tab" data-p="api">5 API</button></div><section id="fields" class="pane on"><div class="card"><div class="head"><div><h2>الخانات</h2><div class="hint">حدد متى تظهر الخانة بناءً على اختيار سابق.</div></div><button onclick="addField()">+ خانة</button></div><div id="fl" class="list"></div></div></section><section id="docs" class="pane"><div class="card"><div class="head"><div><h2>المستندات</h2><div class="hint">اختر الخانة والقيمة التي تجعل المستند يظهر.</div></div><button onclick="addDoc()">+ مستند</button></div><div id="dl" class="list"></div></div></section><section id="fees" class="pane"><div class="card"><div class="head"><div><h2>الرسوم</h2><div class="hint">كل رسم يمكن ربطه باختيار سابق.</div></div><button onclick="addFee()">+ رسم</button></div><div id="pl" class="list"></div></div></section><section id="prev" class="pane"><div class="card"><div class="head"><div><h2>تجربة مثل التطبيق</h2><div class="hint">اختيارات المستخدم تتحكم بما يظهر بعد ذلك.</div></div><button class="s" onclick="state={};preview()">إعادة</button></div><div class="preview"><div class="ptop">Dalilak Preview</div><div class="screen"><h2 id="pt"></h2><div class="hint" id="pc"></div><div id="form"></div></div></div></div></section><section id="api" class="pane"><div class="card"><div class="head"><h2>JSON للمبرمج</h2><button class="s" onclick="copyJ()">نسخ</button></div><pre id="json" class="json"></pre></div></section><div class="bar"><span class="hint" id="sum"></span><div><button class="s" onclick="save()">حفظ</button> <button class="d" onclick="clearAll()">مسح</button></div></div></div><script>let fields=[],docs=[],fees=[],state={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function uid(p){return p+Math.random().toString(36).slice(2,7)}function choices(sel=''){return '<option value="">دائماً</option>'+fields.map(f=>'<option value="'+f.id+'" '+(sel===f.id?'selected':'')+'>'+esc(f.ar||f.key||'خانة')+'</option>').join('')}function vals(fid,sel=''){let f=fields.find(x=>x.id===fid);if(!f||!f.options?.length)return '<option value="">اكتب/أي قيمة</option>';return '<option value="">— اختر —</option>'+f.options.map(o=>'<option value="'+esc(o)+'" '+(o===sel?'selected':'')+'>'+esc(o)+'</option>').join('')}function addField(){fields.push({id:uid('f'),key:'',ar:'',en:'',type:'dropdown',options:[],whenField:'',whenValue:''});render()}function addDoc(){docs.push({id:uid('d'),key:'',ar:'',en:'',required:true,whenField:'',whenValue:''});render()}function addFee(){fees.push({id:uid('p'),ar:'',en:'',amount:'0',whenField:'',whenValue:''});render()}function visible(x){return !x.whenField||String(state[x.whenField]??'')===String(x.whenValue)}function render(){renderFields();renderDocs();renderFees();refresh()}function renderFields(){let r=$('#fl');r.innerHTML='';if(!fields.length){r.innerHTML='<div class="empty">اضغط + خانة. ابدأ مثلاً بـ نوع العملية.</div>';return}fields.forEach((f,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="rgrid"><input class="ar" value="'+esc(f.ar)+'" placeholder="نوع العملية"><input class="key" dir="ltr" value="'+esc(f.key)+'" placeholder="action_type"><select class="type"><option value="dropdown">Dropdown</option><option value="radio">Radio</option><option value="text">كتابة</option><option value="number">رقم</option><option value="multiselect">خدمات إضافية</option></select><input class="opts" value="'+esc((f.options||[]).join(','))+'" placeholder="جديد,تجديد"><button class="d del">حذف</button></div><div class="rgrid" style="margin-top:7px"><span class="badge">تظهر عندما</span><select class="wf">'+choices(f.whenField)+'</select><select class="wv">'+vals(f.whenField,f.whenValue)+'</select><span></span><span></span></div>';d.querySelector('.type').value=f.type;let sync=()=>{f.ar=d.querySelector('.ar').value;f.key=d.querySelector('.key').value.trim().replace(/\s+/g,'_');f.type=d.querySelector('.type').value;f.options=d.querySelector('.opts').value.split(',').map(x=>x.trim()).filter(Boolean);refresh()};d.querySelectorAll('.ar,.key,.type,.opts').forEach(x=>x.oninput=sync);d.querySelector('.wf').onchange=e=>{f.whenField=e.target.value;f.whenValue='';render()};d.querySelector('.wv').onchange=e=>{f.whenValue=e.target.value;refresh()};d.querySelector('.del').onclick=()=>{fields.splice(i,1);render()};r.appendChild(d)})}function renderDocs(){let r=$('#dl');r.innerHTML='';if(!docs.length){r.innerHTML='<div class="empty">ما أضفت مستندات.</div>';return}docs.forEach((x,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="rgrid"><input class="ar" value="'+esc(x.ar)+'" placeholder="صورة جواز السفر"><input class="key" dir="ltr" value="'+esc(x.key)+'" placeholder="passport_copy"><select class="req"><option value="1">مطلوب</option><option value="0">غير مطلوب</option></select><span></span><button class="d del">حذف</button></div><div class="rgrid" style="margin-top:7px"><span class="badge">يظهر عندما</span><select class="wf">'+choices(x.whenField)+'</select><select class="wv">'+vals(x.whenField,x.whenValue)+'</select><span></span><span></span></div>';d.querySelector('.req').value=x.required?'1':'0';let sync=()=>{x.ar=d.querySelector('.ar').value;x.key=d.querySelector('.key').value.trim().replace(/\s+/g,'_');x.required=d.querySelector('.req').value==='1';refresh()};d.querySelectorAll('.ar,.key,.req').forEach(z=>z.oninput=sync);d.querySelector('.wf').onchange=e=>{x.whenField=e.target.value;x.whenValue='';render()};d.querySelector('.wv').onchange=e=>{x.whenValue=e.target.value;refresh()};d.querySelector('.del').onclick=()=>{docs.splice(i,1);render()};r.appendChild(d)})}function renderFees(){let r=$('#pl');r.innerHTML='';if(!fees.length){r.innerHTML='<div class="empty">ما أضفت رسوم.</div>';return}fees.forEach((x,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="rgrid"><input class="ar" value="'+esc(x.ar)+'" placeholder="رسوم التأشيرة"><input class="en" dir="ltr" value="'+esc(x.en)+'" placeholder="Visa Fees"><input class="amt" type="number" value="'+esc(x.amount)+'" placeholder="382"><span></span><button class="d del">حذف</button></div><div class="rgrid" style="margin-top:7px"><span class="badge">يطبق عندما</span><select class="wf">'+choices(x.whenField)+'</select><select class="wv">'+vals(x.whenField,x.whenValue)+'</select><span></span><span></span></div>';let sync=()=>{x.ar=d.querySelector('.ar').value;x.en=d.querySelector('.en').value;x.amount=d.querySelector('.amt').value;refresh()};d.querySelectorAll('.ar,.en,.amt').forEach(z=>z.oninput=sync);d.querySelector('.wf').onchange=e=>{x.whenField=e.target.value;x.whenValue='';render()};d.querySelector('.wv').onchange=e=>{x.whenValue=e.target.value;refresh()};d.querySelector('.del').onclick=()=>{fees.splice(i,1);render()};r.appendChild(d)})}function preview(){let form=$('#form');form.innerHTML='';$('#pt').textContent=$('#sn').value||'الخدمة';$('#pc').textContent=$('#cat').value||'';fields.forEach(f=>{if(!visible(f))return;let w=document.createElement('div');w.className='f';let lab='<label>'+esc(f.ar||f.key||'خانة')+'</label>';if(f.type==='dropdown'){w.innerHTML=lab+'<select><option value="">— اختر —</option>'+f.options.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('')+'</select>';let s=w.querySelector('select');s.value=state[f.id]||'';s.onchange=()=>{state[f.id]=s.value;preview()}}else if(f.type==='radio'){w.innerHTML=lab+f.options.map(o=>'<label style="display:flex;flex-direction:row;gap:7px;margin-top:6px"><input style="width:auto" type="radio" name="'+f.id+'" value="'+esc(o)+'" '+(state[f.id]===o?'checked':'')+'>'+esc(o)+'</label>').join('');w.querySelectorAll('input').forEach(z=>z.onchange=()=>{state[f.id]=z.value;preview()})}else if(f.type==='multiselect'){w.innerHTML=lab+f.options.map(o=>'<label style="display:flex;flex-direction:row;gap:7px;margin-top:6px"><input style="width:auto" type="checkbox" value="'+esc(o)+'">'+esc(o)+'</label>').join('')}else{w.innerHTML=lab+'<input type="'+(f.type==='number'?'number':'text')+'" value="'+esc(state[f.id]||'')+'">';w.querySelector('input').oninput=e=>state[f.id]=e.target.value}form.appendChild(w)});let vd=docs.filter(visible);if(vd.length){let b=document.createElement('div');b.className='card';b.innerHTML='<h2>المستندات المطلوبة</h2>'+vd.map(x=>'<div class="f"><b>'+esc(x.ar||x.key)+'</b><div class="upload">رفع الملف</div></div>').join('');form.appendChild(b)}let vf=fees.filter(visible);if(vf.length){let total=vf.reduce((a,x)=>a+(parseFloat(x.amount)||0),0),b=document.createElement('div');b.className='card';b.innerHTML='<h2>تفاصيل الرسوم</h2>'+vf.map(x=>'<div class="fee"><span>'+esc(x.ar||x.en)+'</span><b>AED '+(parseFloat(x.amount)||0).toFixed(2)+'</b></div>').join('')+'<div class="total"><span>المجموع</span><span>AED '+total.toFixed(2)+'</span></div>';form.appendChild(b)}}function payload(){return{service:{name_ar:$('#sn').value,name_en:$('#se').value,category_ar:$('#cat').value,code:$('#code').value},fields,documents:docs,pricing:fees}}function refresh(){$('#sum').textContent=fields.length+' خانات • '+docs.length+' مستندات • '+fees.length+' رسوم';$('#json').textContent=JSON.stringify(payload(),null,2);preview()}function example(){$('#sn').value='إصدار إقامة عامل مساعد';$('#se').value='Domestic Worker Residence';$('#cat').value='الإقامة والتأشيرات';$('#code').value='domestic_worker_residence';fields=[{id:'action',key:'action_type',ar:'نوع العملية',type:'dropdown',options:['جديد','تجديد'],whenField:'',whenValue:''},{id:'location',key:'location',ar:'مكان تواجد المعني بالطلب',type:'dropdown',options:['داخل الدولة','خارج الدولة'],whenField:'action',whenValue:'جديد'},{id:'emirate',key:'emirate',ar:'الإمارة',type:'dropdown',options:['أبوظبي','دبي','الشارقة'],whenField:'location',whenValue:'داخل الدولة'}];docs=[{id:'d1',key:'passport_copy',ar:'صورة جواز السفر',required:true,whenField:'',whenValue:''},{id:'d2',key:'entry_visa_copy',ar:'صورة تأشيرة الدخول',required:true,whenField:'emirate',whenValue:'أبوظبي'}];fees=[{id:'p1',ar:'رسوم التأشيرة',en:'Visa Fees',amount:'382',whenField:'action',whenValue:'جديد'},{id:'p2',ar:'رسوم تعديل الوضع',en:'Change Status Fees',amount:'584',whenField:'location',whenValue:'داخل الدولة'},{id:'p3',ar:'رسوم الفحص الطبي',en:'Medical Fitness Fees',amount:'390',whenField:'emirate',whenValue:'أبوظبي'}];state={};render()}function save(){localStorage.setItem('dalilakBuilder',JSON.stringify(payload()));alert('تم الحفظ')}function clearAll(){if(!confirm('مسح التجربة؟'))return;fields=[];docs=[];fees=[];state={};['sn','se','cat','code'].forEach(x=>$('#'+x).value='');render()}function copyJ(){navigator.clipboard.writeText(JSON.stringify(payload(),null,2)).then(()=>alert('تم النسخ'))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on');refresh()});['sn','se','cat','code'].forEach(x=>$('#'+x).oninput=refresh);render();</script></body></html>
